[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bjepa"
version = "0.1.0"
description = "Bayesian JEPA for Gene Regulatory Network Inference"
requires-python = ">=3.10"

# Core deps already present in the `bayes_stats` conda env.
# Additional installs needed: pyro-ppl (horseshoe prior / VI) or numpyro
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "arviz>=0.18",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pyro-ppl>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
